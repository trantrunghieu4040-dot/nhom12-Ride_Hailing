name: CI Backend — Ride-Hailing Connect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create minimal package.json for testing
        working-directory: ./backend
        run: |
          # Tạo package.json tối giản chỉ có jest
          cat > /tmp/test-package.json << 'EOF'
          {
            "name": "backend-test-runner",
            "version": "1.0.0",
            "description": "CI test runner"
          }
          EOF
          mkdir -p /tmp/ci-runner
          cp /tmp/test-package.json /tmp/ci-runner/package.json

      - name: Install Jest in isolated dir
        run: |
          cd /tmp/ci-runner
          npm install jest --save-dev 2>&1
          echo "Jest version: $(./node_modules/.bin/jest --version)"

      - name: Run backend tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-nhom12
        run: |
          /tmp/ci-runner/node_modules/.bin/jest \
            --testEnvironment=node \
            --roots=./tests \
            --passWithNoTests \
            --forceExit \
            --no-coverage \
            --no-cache \
            2>&1 || (echo "=== JEST FAILED with exit code $? ===" && exit 1)

      - name: All tests passed!
        run: echo "✅ Backend CI passed!"
