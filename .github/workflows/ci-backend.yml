name: CI Backend — Ride-Hailing Connect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Jest
        run: npm install jest

      - name: Verify test files exist
        run: |
          echo "=== Test files ==="
          find tests -name "*.test.js" -type f
          echo "=== Jest config ==="
          cat jest.config.js

      - name: Run all tests
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-nhom12
        run: npx jest --config jest.config.js --passWithNoTests --forceExit --no-coverage

      - name: Summary
        run: echo "✅ Backend tests passed!"
