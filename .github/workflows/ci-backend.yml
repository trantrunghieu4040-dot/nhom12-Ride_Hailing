name: CI Backend — Ride-Hailing Connect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Jest
        run: npm install jest

      - name: Verify setup
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Jest: $(./node_modules/.bin/jest --version)"
          echo "Test files:"
          find tests -name "*.test.js" 2>/dev/null || echo "No test files found"

      - name: Run all tests
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-nhom12
        run: |
          ./node_modules/.bin/jest \
            --testEnvironment node \
            --testMatch "**/*.test.js" \
            --passWithNoTests \
            --forceExit \
            --no-coverage \
            --rootDir . \
            tests/

      - name: Summary
        run: echo "✅ Backend tests passed!"
