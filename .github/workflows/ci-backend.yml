name: CI Backend — Ride-Hailing Connect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies only
        run: npm install --ignore-scripts --no-audit --no-fund jest

      - name: Show environment
        run: |
          node --version
          npx jest --version
          echo "Test files:"
          find . -name "*.test.js" -not -path "*/node_modules/*"

      - name: Run tests
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-nhom12
        run: npx jest --passWithNoTests --forceExit --no-coverage

      - name: All tests passed!
        run: echo "✅ Backend CI passed!"
