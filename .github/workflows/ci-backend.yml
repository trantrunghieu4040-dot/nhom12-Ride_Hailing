name: CI Backend — Ride-Hailing Connect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Jest globally
        run: npm install -g jest@29

      - name: Verify Jest installation
        run: |
          which jest || echo "jest not in PATH"
          jest --version || echo "jest --version failed"
          node -e "console.log('Node works')"

      - name: List backend test files
        working-directory: ./backend
        run: |
          echo "=== CWD ==="
          pwd
          echo "=== Contents ==="
          ls -la
          echo "=== Tests dir ==="
          ls -la tests/ || echo "no tests dir"
          ls -la tests/unit/ || echo "no unit dir"

      - name: Run tests (with error output)
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-nhom12
        run: |
          set +e
          jest tests/ --testEnvironment=node --passWithNoTests --forceExit --no-coverage --no-cache
          EXIT_CODE=$?
          echo "=== Jest exit code: $EXIT_CODE ==="
          exit $EXIT_CODE

      - name: All tests passed!
        run: echo "Backend CI passed!"
