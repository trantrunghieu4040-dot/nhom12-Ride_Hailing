name: CI Backend — Ride-Hailing Connect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Jest
        run: npm install -g jest@29

      - name: Verify Jest
        run: jest --version

      - name: Run tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-nhom12
        run: jest tests/ --testEnvironment=node --passWithNoTests --forceExit --no-coverage --no-cache

      - name: All tests passed!
        run: echo "✅ Backend CI passed!"
