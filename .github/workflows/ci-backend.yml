name: CI Backend — Ride-Hailing Connect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Jest
        run: npm install --ignore-scripts jest

      - name: Debug environment
        run: |
          node --version
          npx jest --version
          echo "=== Files in backend/ ==="
          ls -la
          echo "=== Test files ==="
          find tests/ -name "*.js" 2>/dev/null || echo "No tests dir"

      - name: Run tests
        env:
          NODE_ENV: test
        run: |
          npx jest \
            --testEnvironment=node \
            --roots=./tests \
            --passWithNoTests \
            --forceExit \
            --no-coverage \
            --no-cache \
            2>&1
