name: CI Backend — Ride-Hailing Connect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies only
        run: npm install --no-save jest supertest --prefer-offline 2>/dev/null || npm install jest supertest

      - name: Run Unit Tests
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-nhom12
        run: npx jest tests/unit --passWithNoTests --forceExit --no-coverage

      - name: Run Integration Tests
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-nhom12
        run: npx jest tests/integration --passWithNoTests --forceExit --no-coverage

      - name: Summary
        run: echo "✅ Backend tests passed!"
