name: CI Backend — Ride-Hailing Connect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: List test files
        run: |
          echo "=== Working dir: $(pwd) ==="
          echo "=== Test files ==="
          find tests -name "*.test.js" 2>/dev/null && echo "Tests found" || echo "No tests dir"

      - name: Run tests with npx
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-nhom12
        run: |
          npx --yes jest@29 tests/ \
            --testEnvironment=node \
            --passWithNoTests \
            --forceExit \
            --no-coverage \
            --no-cache

      - name: All tests passed!
        run: echo "Backend CI passed!"
