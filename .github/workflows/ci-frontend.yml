name: CI Frontend — Ride-Hailing Connect

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  test-customer-app:
    name: Customer App — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/customer-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/customer-app/package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test -- --passWithNoTests

  test-driver-app:
    name: Driver App — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/driver-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/driver-app/package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test -- --passWithNoTests

  test-admin-web:
    name: Admin Web — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/admin-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/admin-web/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build production bundle
        run: npm run build
