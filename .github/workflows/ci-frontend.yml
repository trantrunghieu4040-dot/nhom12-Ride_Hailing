name: CI Frontend — Ride-Hailing Connect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Customer App (React Native) — Jest tests
  # ─────────────────────────────────────────────────────────────
  test-customer-app:
    name: Customer App — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/customer-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npx --yes jest@29 --passWithNoTests --forceExit --no-coverage --testEnvironment=node
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────
  # Driver App (React Native) — Jest tests
  # ─────────────────────────────────────────────────────────────
  test-driver-app:
    name: Driver App — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/driver-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npx --yes jest@29 --passWithNoTests --forceExit --no-coverage --testEnvironment=node
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────
  # Admin Web (Vite + React) — Build
  # ─────────────────────────────────────────────────────────────
  test-admin-web:
    name: Admin Web — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build production bundle
        run: npm run build
