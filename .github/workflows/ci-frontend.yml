name: CI Frontend — Ride-Hailing Connect

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  test-customer-app:
    name: Customer App — Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/customer-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend/customer-app
      - name: Lint
        run: npm run lint
        working-directory: ./frontend/customer-app
      - name: Run tests
        run: npm test -- --watchAll=false
        working-directory: ./frontend/customer-app

  test-driver-app:
    name: Driver App — Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend/driver-app
      - name: Run tests
        run: npm test -- --watchAll=false
        working-directory: ./frontend/driver-app

  test-admin-web:
    name: Admin Web — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend/admin-web
      - name: Lint
        run: npm run lint
        working-directory: ./frontend/admin-web
      - name: Build production bundle
        run: npm run build
        working-directory: ./frontend/admin-web
